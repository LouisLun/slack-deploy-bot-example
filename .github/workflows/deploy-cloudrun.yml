name: Deploy to Cloud Run

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (default: latest)"
        required: false
        default: latest

env:
  IMAGE: coffeesouffle/slack-deploy-bot:${{ inputs.image_tag }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Build env vars file
        run: |
          python3 - <<'EOF'
          import json, os

          vars = {
              "SLACK_SIGNING_SECRET": os.environ["SLACK_SIGNING_SECRET"],
              "SLACK_BOT_TOKEN": os.environ["SLACK_BOT_TOKEN"],
              "GITHUB_CLIENT_ID": os.environ["GH_CLIENT_ID"],
              "GITHUB_CLIENT_SECRET": os.environ["GH_CLIENT_SECRET"],
              "GCS_BUCKET_NAME": os.environ["GCS_BUCKET_NAME"],
              "GCS_CONFIG_FILE_PATH": os.environ["GCS_CONFIG_FILE_PATH"],
          }

          optional = {
              "DEPLOY_CONFIG_JSON": "DEPLOY_CONFIG_JSON",
              "GITHUB_AUTH_MODE": "GH_AUTH_MODE",
              "GITHUB_APP_ID": "GH_APP_ID",
              "GITHUB_PRIVATE_KEY": "GH_PRIVATE_KEY",
              "GITHUB_INSTALLATION_ID": "GH_INSTALLATION_ID",
          }
          for cloud_key, env_key in optional.items():
              val = os.environ.get(env_key, "")
              if val:
                  vars[cloud_key] = val

          with open("/tmp/env-vars.yaml", "w") as f:
              for k, v in vars.items():
                  f.write(f"{k}: {json.dumps(v)}\n")
          EOF
        env:
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          GCS_BUCKET_NAME: ${{ vars.GCS_BUCKET_NAME }}
          GCS_CONFIG_FILE_PATH: ${{ vars.GCS_CONFIG_FILE_PATH }}
          DEPLOY_CONFIG_JSON: ${{ secrets.DEPLOY_CONFIG_JSON }}
          GH_AUTH_MODE: ${{ secrets.GH_AUTH_MODE }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_PRIVATE_KEY: ${{ secrets.GH_PRIVATE_KEY }}
          GH_INSTALLATION_ID: ${{ secrets.GH_INSTALLATION_ID }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --timeout=3600
            --min-instances=0
            --max-instances=3
            --concurrency=10
            --env-vars-file=/tmp/env-vars.yaml

      - name: Cleanup old revisions
        run: |
          gcloud run revisions list \
            --service "$SERVICE" \
            --region "$REGION" \
            --format="value(name)" \
            --sort-by="~creationTimestamp" \
          | tail -n +8 \
          | xargs -r -I {} gcloud run revisions delete {} --region "$REGION" --quiet
        env:
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          REGION: ${{ vars.GCP_REGION }}
