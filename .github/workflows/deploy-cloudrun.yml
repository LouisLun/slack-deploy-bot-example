name: Deploy to Cloud Run

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (default: latest)"
        required: false
        default: latest

env:
  IMAGE: coffeesouffle/slack-deploy-bot:${{ inputs.image_tag }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Prepare env vars file
        run: |
          cat > /tmp/cloudrun.env << 'ENVEOF'
          SLACK_SIGNING_SECRET=${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }}
          GCS_BUCKET_NAME=${{ vars.GCS_BUCKET_NAME }}
          GCS_CONFIG_FILE_PATH=${{ vars.GCS_CONFIG_FILE_PATH }}
          ENVEOF
          # Write DEPLOY_CONFIG_JSON separately to preserve JSON special characters
          if [ -n "$DEPLOY_CONFIG_JSON" ]; then
            printf 'DEPLOY_CONFIG_JSON=%s\n' "$DEPLOY_CONFIG_JSON" >> /tmp/cloudrun.env
          fi
        env:
          DEPLOY_CONFIG_JSON: ${{ secrets.DEPLOY_CONFIG_JSON }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --timeout=3600
            --min-instances=0
            --max-instances=3
            --concurrency=10
          env_vars_file: /tmp/cloudrun.env
